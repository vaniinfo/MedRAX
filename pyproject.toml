[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrax"
version = "0.1.0"
description = "medical reasoning agent for chest x-ray"
authors = [
    {name = "Adibvafa Fallahpour", email = "adibvafa.fallahpour@mail.utoronto.ca"},
]
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.25.0",
    "numpy<2",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.2",
    "langchain-anthropic>=0.0.2",
    "langgraph>=0.0.10",
    "python-dotenv>=0.19.0",
    "pandas>=1.3.0",
    "pydantic>=1.8.0",
    "Pillow>=8.0.0",
    "torchxrayvision>=0.0.37",
    # PATCH: was a git pin (resolves to 4.46.0.dev0). CheXagent-2-3b requires
    # transformers 4.40 and SILENTLY stops attending to its image tokens on
    # newer versions - it returns confident, well-formed answers that ignore
    # the X-ray entirely. xray_vqa.py fakes __version__ = "4.40.0" to skip the
    # model's own version check, which hides the problem instead of fixing it.
    # NOTE: the git pin may be required by LlavaMedTool / XRayPhraseGroundingTool,
    # which are disabled here and therefore untested against 4.40.
    "transformers==4.40.0",
    "tokenizers>=0.19,<0.20",
    "sentencepiece>=0.1.95",
    "shortuuid>=1.0.0",
    "accelerate>=0.12.0",
    "peft>=0.2.0",
    "bitsandbytes>=0.35.0",
    "markdown2[all]>=2.4.0",
    "protobuf>=3.15.0",
    "scikit-learn>=0.24.0",
    # PATCH: removed a duplicate, weaker "gradio>=3.0.0" pin here; the real
    # constraint lives further down with the other UI deps.
    "gradio_client>=0.2.0",
    "httpx>=0.23.0",
    "uvicorn>=0.15.0",
    "fastapi>=0.68.0",
    "einops>=0.3.0",
    "einops-exts>=0.0.4",
    "timm>=0.5.0",
    "tiktoken>=0.3.0",
    "openai>=0.27.0",
    "backoff>=1.10.0",
    "torch>=2.2.0",
    "torchvision>=0.10.0",
    "scikit-image>=0.18.0",
    # PATCH: was "gradio>=5.0.0" (unbounded). Gradio 6 removed the `type`
    # parameter from gr.Chatbot, which interface.py passes as type="messages",
    # so an unbounded pin installs a version this UI cannot run on.
    "gradio>=5.0.0,<6",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "diffusers>=0.20.0",
    "pydicom>=2.3.0",
    # PATCH: was "gdcm>=1.0.0", which does not exist on PyPI. The GDCM Python
    # bindings are published as "python-gdcm" (provides the same `gdcm` module).
    "python-gdcm>=3.0.0",
    "pylibjpeg>=1.0.0",
    "jupyter>=1.0.0",
    "albumentations>=1.0.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "flake8",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["medrax*"]
exclude = ["med_env*", "demo*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
